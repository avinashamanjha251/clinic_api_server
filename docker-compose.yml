version: '3.8'

services:
  clinic-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_api_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      - MONGODB_URI_PROD=${MONGODB_URI_PROD}
      - MONGODB_URI_DEV=${MONGODB_URI_DEV}
      - MONGO_DB_NAME_PROD=${MONGO_DB_NAME_PROD}
      - MONGO_DB_NAME_DEV=${MONGO_DB_NAME_DEV}

      # Authentication Configuration
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
      - BASIC_AUTH_ADMIN_USERNAME=${BASIC_AUTH_ADMIN_USERNAME}
      - BASIC_AUTH_ADMIN_PASSWORD=${BASIC_AUTH_ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

      # Email Configuration
      - SMTP_HOSTNAME=${SMTP_HOSTNAME}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}

      # Security Configuration
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # Application Configuration
      - VAPOR_ENV=production
      - API_BASE_URL=http://3.7.95.138:8080

    env_file:
      - .env
    networks:
      - clinic-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: clinic_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - clinic-api
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge

volumes:
  clinic-data:
    driver: local
